name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          AAA5CC: ${{ secrets.AAA5CC }}
          BC55F1: ${{ secrets.BC55F1 }}
        run: |
          python3 -c "
          import pathlib, sys, os
          env_a = os.environ.get('AAA5CC', '')
          env_b = os.environ.get('BC55F1', '')
          doc = pathlib.Path('index.html')
          body = doc.read_text(encoding='utf-8')
          result = body
          if env_a:
              result = result.replace('<!-- 5ab8f70364d86aaeef57a6cf08 -->', env_a)
          if env_b:
              result = result.replace('<!-- 115db796e0c3a34f1b1deb18 -->', env_b)
          if result == body and (env_a or env_b):
              sys.exit(1)
          if result != body:
              doc.write_text(result, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
